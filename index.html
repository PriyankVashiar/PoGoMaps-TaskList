<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoGo Quest Route Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>PoGo Quest Route Generator</h1>

    <div class="cards-grid">
        <!-- Item Card (t2) -->
        <div class="card">
            <div class="card-header">Items (t2)</div>
            <div class="card-body" id="card-2"></div>
        </div>

        <!-- Stardust Card (t3) -->
        <div class="card">
            <div class="card-header">Stardust (t3)</div>
            <div class="card-body" id="card-3"></div>
        </div>

        <!-- Encounters Card (t7) -->
        <div class="card">
            <div class="card-header">Pokémon Encounters (t7)</div>
            <div class="card-body" id="card-7"></div>
        </div>

        <!-- Mega Energy Card (t12) -->
        <div class="card">
            <div class="card-header">Mega Energy (t12)</div>
            <div class="card-body" id="card-12"></div>
        </div>
    </div>

    <div class="controls-panel">
        <button class="btn-generate" onclick="generateAndDownloadGPX()">Generate & Download GPX</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
