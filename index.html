<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Go Route Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Container with Inline City Dropdown -->
    <header class="header-container">
        <select id="city-select" class="city-dropdown" onchange="onCityChange()">
            <option value="https://nycpokemap.com" selected>New York</option>
            <option value="https://vanpokemap.com">Vancouver</option>
            <option value="https://sgpokemap.com">Singapore</option>
            <option value="https://sydneypogomap.com">Sydney</option>
            <option value="https://londonpogomap.com">London</option>
        </select>
        <h1 class="main-title">Pokémon Go Route Generator</h1>
    </header>

    <div class="cards-grid">
        <!-- Item Card -->
        <div class="card">
            <div class="card-header">
                <img src="./assets/icons/Items.png" alt="Items" class="header-icon">
                Items
            </div>
            <div class="card-body" id="card-2"></div>
        </div>

        <!-- Stardust Card -->
        <div class="card">
            <div class="card-header">
                <img src="./assets/icons/Stardust.png" alt="Stardust" class="header-icon" referrerpolicy="no-referrer">
                Stardust
            </div>
            <div class="card-body" id="card-3"></div>
        </div>

        <!-- Encounters Card -->
        <div class="card">
            <div class="card-header">
                <img src="./assets/icons/Pokémon.png" alt="Pokémon" class="header-icon">
                Pokémon
            </div>
            <div class="card-body" id="card-7"></div>
        </div>

        <!-- Mega Energy Card -->
        <div class="card">
            <div class="card-header">
                <img src="./assets/icons/Mega_Energy.png" alt="Mega Energy" class="header-icon">
                Mega Energy
            </div>
            <div class="card-body" id="card-12"></div>
        </div>
    </div>

    <div class="controls-panel">
        <button class="btn-generate" onclick="generateAndDownloadGPX()">Generate & Download GPX</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
