<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Go Route Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Pokémon Go Route Generator</h1>

    <div class="cards-grid">
        <!-- Item Card -->
        <div class="card">
            <div class="card-header">Items</div>
            <div class="card-body" id="card-2"></div>
        </div>

        <!-- Stardust Card -->
        <div class="card">
            <div class="card-header">
                <img src="assets/icons/Stardust.png" alt="Stardust" class="header-icon">
                Stardust
            </div>
            <div class="card-body" id="card-3"></div>
        </div>

        <!-- Encounters Card -->
        <div class="card">
            <div class="card-header">
                <img src="assets/icons/Pokémon.png" alt="Pokémon" class="header-icon">
                Pokémon
            </div>
            <div class="card-body" id="card-7"></div>
        </div>

        <!-- Mega Energy Card -->
        <div class="card">
            <div class="card-header">
                <img src="assets/icons/Mega_Energy.png" alt="Mega Energy" class="header-icon">
                Mega Energy (10)
            </div>
            <div class="card-body" id="card-12"></div>
        </div>
    </div>

    <div class="controls-panel">
        <button class="btn-generate" onclick="generateAndDownloadGPX()">Generate & Download GPX</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
