name: Daily Map Scraper

on:
  repository_dispatch:
    types: [run_scraper]
  schedule:
    # 12:18 AM local time schedules converted to UTC:
    - cron: '18 16 * * *' # 12:18 AM SGT (Singapore)
    - cron: '18 14 * * *' # 12:18 AM AEST (Sydney)
    - cron: '18 0 * * *'  # 12:18 AM GMT (London / UK)
    - cron: '18 4 * * *'  # 12:18 AM EDT (New York)
    - cron: '18 7 * * *'  # 12:18 AM PDT (Vancouver)
  workflow_dispatch:
    inputs:
      target_city:
        description: 'City to scrape (nyc, vc, sg, syd, uk, or all)'
        required: true
        default: 'all'

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Determine Target City & Run Scraper
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target_city }}"
          else
            case "${{ github.event.schedule }}" in
              "18 16 * * *") TARGET="sg" ;;
              "18 14 * * *") TARGET="syd" ;;
              "18 0 * * *") TARGET="uk" ;;
              "18 4 * * *") TARGET="nyc" ;;
              "18 7 * * *") TARGET="vc" ;;
              *) TARGET="all" ;;
            esac
          fi
          
          echo "Running scraper for target: $TARGET"
          python map_scraper.py $TARGET

      - name: Commit and Push Generated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add JSON/
          
          if git diff --staged --quiet; then
            echo "No new JSON changes detected."
          else
            git commit -m "Auto-updated quest JSON files [skip ci]"
            git push
          fi