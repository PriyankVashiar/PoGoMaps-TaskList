name: Daily Map Scraper

on:
  schedule:
    # 1:00 AM local time schedules converted to UTC:
    - cron: '0 17 * * *' # 1:00 AM SGT (Singapore)
    - cron: '0 15 * * *' # 1:00 AM AEST (Sydney)
    - cron: '0 1 * * *'  # 1:00 AM GMT (London / UK)
    - cron: '0 5 * * *'  # 1:00 AM EDT (New York)
    - cron: '0 8 * * *'  # 1:00 AM PDT (Vancouver)
  workflow_dispatch:
    inputs:
      target_city:
        description: 'City to scrape (nyc, vc, sg, syd, uk, or all)'
        required: true
        default: 'all'

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Determine Target City & Run Scraper
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target_city }}"
          else
            case "${{ github.event.schedule }}" in
              "0 17 * * *") TARGET="sg" ;;
              "0 15 * * *") TARGET="syd" ;;
              "0 1 * * *") TARGET="uk" ;;
              "0 5 * * *") TARGET="nyc" ;;
              "0 8 * * *") TARGET="vc" ;;
              *) TARGET="all" ;;
            esac
          fi
          
          echo "TARGET=$TARGET" >> $GITHUB_ENV
          echo "Running scraper for target: $TARGET"
          python map_scraper.py $TARGET

      - name: Clean Up Old Quest Files
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          cleanup_city() {
            CITY=$1
            for file in JSON/${CITY}_*.json; do
              if [ -f "$file" ] && [ "$file" != "JSON/${CITY}_${TODAY}.json" ]; then
                echo "Deleting old quest file: $file"
                rm -f "$file"
              fi
            done
          }

          if [ "$TARGET" = "all" ]; then
            for c in nyc vc sg syd uk; do
              cleanup_city "$c"
            done
          else
            cleanup_city "$TARGET"
          fi

      - name: Commit and Push Generated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A JSON/
          
          if git diff --staged --quiet; then
            echo "No new JSON changes detected."
          else
            git commit -m "Auto-generated daily quest JSON & cleaned old files [skip ci]"
            git push
          fi