name: Daily Map Scraper

on:
  schedule:
    # Triggers every day at 5:00 AM UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Clean Old Quests JSON Files
        run: |
          echo "Removing previous daily quest files..."
          rm -f JSON/quests_*.json

      - name: Run Scraper
        run: python map_scrapper.py

      - name: Commit and Push Generated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add JSON/
          
          if git diff --staged --quiet; then
            echo "No new JSON changes detected."
          else
            git commit -m "Auto-generated daily quest JSON [skip ci]"
            git push
          fi