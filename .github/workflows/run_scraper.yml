name: Daily Map Scraper

on:
  schedule:
    # Triggers at 5:00 AM UTC (1:00 AM EDT) and 6:00 AM UTC (1:00 AM EST)
    - cron: '0 5,6 * * *'
  # Enables manual execution via the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check New York Time
        id: check_time
        run: |
          # Fetch current hour in New York timezone (00-23 format)
          NY_HOUR=$(TZ="America/New_York" date +%H)
          echo "Current New York Hour: $NY_HOUR"
          
          # Proceed only if the hour is 01 (1:00 AM) or if manually triggered
          if [ "$NY_HOUR" -eq "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_scraper=true" >> $GITHUB_OUTPUT
          else
            echo "Skipping run because it is not 1:00 AM in New York."
            echo "run_scraper=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Repository
        if: steps.check_time.outputs.run_scraper == 'true'
        uses: actions/checkout@v5

      - name: Set up Python
        if: steps.check_time.outputs.run_scraper == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        if: steps.check_time.outputs.run_scraper == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Clean Old Quests JSON Files
        if: steps.check_time.outputs.run_scraper == 'true'
        run: |
          echo "Removing previous daily quest files..."
          rm -f JSON/quests_*.json

      - name: Run Scraper
        if: steps.check_time.outputs.run_scraper == 'true'
        run: python Scripts/map_scrapper.py

      - name: Commit and Push Generated JSON
        if: steps.check_time.outputs.run_scraper == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add JSON/
          
          if git diff --staged --quiet; then
            echo "No new JSON changes detected."
          else
            git commit -m "Auto-generated daily quest JSON [skip ci]"
            git push
          fi