name: Daily Quest Scraper & Route Map Generator

on:
  schedule:
    # 10:30 AM IST is 05:00 AM UTC
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-scraper-and-map:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests folium

      - name: Run Scraper and Generator
        run: |
          python Scripts/PoGoMaps-Scrapper.py
          python Scripts/generate_route_map.py

      - name: Commit and Push Updated Data & Map
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add JSON/ index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily quests and index.html [skip ci]" && git push)